# Streamlit server config - used when the dashboard is hosted on Render,
# Streamlit Community Cloud, or any reverse proxy.
# (Command-line flags passed to `streamlit run` override these values.)

[server]
headless = true
address = "0.0.0.0"
port = 8501
# Disable CORS/XSRF checks so the app works behind hosted reverse proxies.
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
